# Sveltia CMS — the editing UI at /admin.
#
# Saving here writes a commit to src/content/products.json on main, which the
# deploy workflow picks up and pushes to Namecheap. There is no database: this
# file describes the form, git holds the data.
#
# The six category IDs below are duplicated from ProductCategory in
# src/content/products.ts. They are structural — each ID is also a key in
# categoryIcons — so adding one is a code change in three places, and
# productsSchema.ts will fail the build if this list ever drifts from that one.

backend:
  name: github
  repo: Sherifelshryf/loremed-pharma
  branch: main
  # Sign in with a GitHub personal access token. The alternative, `oauth`,
  # needs an OAuth app plus a server-side endpoint holding its client secret —
  # and this repo is public, so that secret would have nowhere safe to live.
  auth_methods:
    - token
  # Without this the CMS may tag its commits [skip ci], which would stop the
  # deploy workflow and leave edits saved but never published. `skip_ci: false`
  # is the current spelling; `automatic_deployments: true` meant the same thing
  # and is deprecated.
  skip_ci: false
  commit_messages:
    update: 'Update {{collection}} via CMS'
    delete: 'Delete from {{collection}} via CMS'
    uploadMedia: 'Upload {{path}} via CMS'
    deleteMedia: 'Delete {{path}} via CMS'

# Uploads land beside the existing packshots and are referenced the same way.
media_folder: public/media
public_folder: /media

collections:
  - name: catalogue
    label: Catalogue
    files:
      - name: products
        label: Products
        file: src/content/products.json
        format: json
        fields:
          - name: products
            label: Products
            label_singular: Product
            widget: list
            # `hint`, not `description`: the CMS has no `description` option on
            # a file, so this guidance was being parsed and then thrown away —
            # no editor ever saw it. Its own config validator said so.
            hint: >-
              Changes go live a couple of minutes after saving. Every field with
              both English and العربية appears on the site in that language, so
              leaving one side blank leaves a gap for half your visitors.
            # products.json is a bare array with no wrapper object; `root`
            # keeps it that way rather than nesting it under a "products" key.
            root: true
            collapsed: true
            summary: '{{fields.name.en}} — {{fields.price}} EGP'
            fields:
              # --- identity -------------------------------------------------
              - name: name
                label: Product name
                widget: object
                collapsed: false
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: slug
                label: URL slug
                widget: string
                hint: >-
                  Appears in the web address, e.g. "ivylor" gives
                  /products/ivylor. Lower-case letters, numbers and hyphens
                  only. Changing it breaks any existing link to this product.
                pattern:
                  - '^[a-z0-9-]+$'
                  - Only a-z, 0-9 and hyphens

              - name: tagline
                label: Tagline
                widget: object
                collapsed: false
                hint: The short line under the product name on the card.
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              # --- commercial -----------------------------------------------
              - name: price
                label: Price (EGP)
                widget: number
                value_type: int
                min: 0

              - name: status
                label: Status
                widget: select
                default: available
                options:
                  - { label: Available now, value: available }
                  - { label: Coming soon (under registration), value: under-registration }

              - name: category
                label: Category
                widget: select
                options:
                  - { label: Cough & Chest, value: respiratory-care }
                  - { label: For Children, value: kids-health }
                  - { label: Vitamins & Minerals, value: vitamins-minerals }
                  - { label: Immunity, value: immune-support }
                  - { label: Omega-3 & Focus, value: omega-brain }
                  - { label: Skin Care, value: dermatology }

              - name: secondaryCategories
                label: Also list under
                widget: select
                multiple: true
                required: false
                hint: Optional. Extra categories this product shows up in when filtering.
                options:
                  - { label: Cough & Chest, value: respiratory-care }
                  - { label: For Children, value: kids-health }
                  - { label: Vitamins & Minerals, value: vitamins-minerals }
                  - { label: Immunity, value: immune-support }
                  - { label: Omega-3 & Focus, value: omega-brain }
                  - { label: Skin Care, value: dermatology }

              # --- presentation ---------------------------------------------
              - name: form
                label: Dosage form
                widget: object
                collapsed: false
                hint: e.g. Syrup, Oral drops, Lotion.
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: ageGroup
                label: Suitable for
                widget: object
                collapsed: false
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: pack
                label: Pack size
                widget: object
                collapsed: false
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: image
                label: Photo
                widget: image
                required: false
                hint: >-
                  Upload a JPEG. A WebP works too, but only if a .jpg of the
                  same name sits beside it — older phones cannot read WebP and
                  fall back to the JPEG.

              - name: accent
                label: Card colour
                widget: select
                default: purple
                options:
                  - { label: Purple, value: purple }
                  - { label: Orange, value: orange }

              - name: featured
                label: Show first on the home page
                widget: boolean
                required: false
                default: false
                hint: >-
                  Moves this product to the front of the grid on the home page.
                  Everything still appears either way — this only changes the
                  order.

              # --- copy ------------------------------------------------------
              - name: shortDescription
                label: Short description
                widget: object
                collapsed: false
                hint: One or two sentences. Shown on the product card and in search results.
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: ar, label: العربية, widget: text }

              - name: description
                label: Full description
                widget: object
                collapsed: false
                hint: >-
                  The main paragraph on the product page. Doses and ingredient
                  amounts here must match the carton exactly.
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: ar, label: العربية, widget: text }

              - name: keyIngredients
                label: Key ingredients
                label_singular: Ingredient
                widget: list
                collapsed: true
                summary: '{{fields.name.en}}'
                fields:
                  - name: name
                    label: Ingredient
                    widget: object
                    collapsed: false
                    fields:
                      - { name: en, label: English, widget: string }
                      - { name: ar, label: العربية, widget: string }
                  - name: note
                    label: Amount and action
                    widget: object
                    collapsed: false
                    hint: e.g. "38 mg per 5 ml — bronchodilator, mucolytic".
                    fields:
                      - { name: en, label: English, widget: text }
                      - { name: ar, label: العربية, widget: text }

              - name: benefits
                label: Benefits
                label_singular: Benefit
                widget: list
                collapsed: true
                summary: '{{fields.en}}'
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: usage
                label: How to use
                widget: object
                collapsed: false
                hint: Dosing instructions. Must match the carton exactly.
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: ar, label: العربية, widget: text }

              # --- links -----------------------------------------------------
              - name: related
                label: Related products
                label_singular: Slug
                widget: list
                required: false
                hint: >-
                  Slugs of other products, one per line, e.g. "ivylor". Shown at
                  the bottom of this product's page. A slug that does not match
                  a real product will fail the build rather than break the site.
                field: { name: slug, label: Slug, widget: string }

              - name: youtubeId
                label: YouTube video ID
                widget: string
                required: false
                hint: >-
                  Just the ID, the part after watch?v= — not the whole address.
                  Leave blank for no video.

  - name: offers
    label: Offers
    files:
      - name: bundles
        label: Bundles
        file: src/content/bundles.json
        format: json
        fields:
          - name: bundles
            label: Bundles
            label_singular: Bundle
            widget: list
            hint: >-
              Sets of products sold together at one price. While this list is
              empty the Offers page says "coming soon" — add a bundle, set it to
              Active, and the page becomes a shop a couple of minutes later.
              Both prices are typed by hand: the site does not work them out
              from the products inside.
            # bundles.json is a bare array, same as products.json.
            root: true
            collapsed: true
            summary: '{{fields.name.en}} — {{fields.price}} EGP'
            required: false
            fields:
              - name: name
                label: Bundle name
                widget: object
                collapsed: false
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: slug
                label: URL slug
                widget: string
                hint: >-
                  Lower-case letters, numbers and hyphens, e.g. "immunity-pack".
                  Used internally to identify the bundle in someone's cart, so
                  changing it empties it from any basket it is already sitting
                  in.
                pattern:
                  - '^[a-z0-9-]+$'
                  - Only a-z, 0-9 and hyphens

              - name: status
                label: Status
                widget: select
                default: hidden
                hint: >-
                  Hidden keeps a bundle off the site while you work on it.
                  Nothing appears to customers until this is set to Active.
                options:
                  # Quoted: an unquoted comma inside a flow mapping ends the
                  # value, so "Hidden — draft, not on the site" parsed as a
                  # label of "Hidden — draft" plus a stray key. The CMS config
                  # validator caught it; nothing else would have.
                  - { label: 'Active — visible and buyable', value: active }
                  - { label: 'Hidden — draft, not on the site', value: hidden }

              - name: tagline
                label: Tagline
                widget: object
                collapsed: false
                hint: The short line under the bundle name on the card.
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ar, label: العربية, widget: string }

              - name: description
                label: Description
                widget: object
                collapsed: false
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: ar, label: العربية, widget: text }

              - name: items
                label: What's in the bundle
                label_singular: Product
                widget: list
                collapsed: false
                summary: '{{fields.slug}} ×{{fields.quantity}}'
                hint: >-
                  One row per product. Pick each one from the list — it is your
                  own Products catalogue, so a product that does not exist
                  cannot be chosen.
                fields:
                  # A menu reading the real catalogue, not free text.
                  #
                  # Typing the name on the carton — "SMARTOD D" rather than
                  # "smartod-d" — stopped a deploy, twice, and the editor had no
                  # way of knowing: the CMS said "saved" and the site simply
                  # never changed. A pattern refuses the capitals but still
                  # accepts "smartodd", which is shaped correctly and is not a
                  # product. Choosing from the catalogue puts the whole class of
                  # mistake out of reach.
                  #
                  # `products.*.slug` is the path into the Products file: the
                  # list field there is named `products`, and `*` walks it. The
                  # value stored is still the slug, so bundles.json keeps its
                  # shape and nothing downstream knows this became a menu.
                  - name: slug
                    label: Product
                    widget: relation
                    collection: catalogue
                    file: products
                    value_field: 'products.*.slug'
                    # Name first, then slug, so a row reads "Smartod D smartod-d"
                    # — recognisable, while still showing what gets stored.
                    display_fields: ['products.*.name.en', 'products.*.slug']
                    search_fields: ['products.*.name.en', 'products.*.slug']
                  - { name: quantity, label: How many, widget: number, value_type: int, min: 1, default: 1 }

              - name: price
                label: Bundle price (EGP)
                widget: number
                value_type: int
                min: 0
                hint: What the customer actually pays for the whole bundle.

              - name: compareAtPrice
                label: Was price (EGP)
                widget: number
                value_type: int
                required: false
                hint: >-
                  Optional. Shown struck through next to the price, and the
                  difference becomes the "Save X" badge. Must be higher than the
                  bundle price — leave it blank if there is no saving to show.

              - name: image
                label: Photo
                widget: image
                required: false
                hint: >-
                  Optional. Upload a JPEG. If this bundle is Featured, the photo
                  becomes the whole slide on the home page, so a wide picture
                  (16:9, like a banner) suits it best — a square one gets its
                  top and bottom cropped on a computer screen. Leave it empty
                  and the slide shows the products inside it instead, with the
                  name and price written beside them.

              - name: featured
                label: Feature this bundle
                widget: boolean
                required: false
                default: false
                hint: >-
                  Gives the bundle a slide in the slideshow on the home page,
                  and puts it first on the Offers page. The slide shows the
                  photo above if there is one, and the products inside it side
                  by side if there isn't. Only works while the bundle is Active.
